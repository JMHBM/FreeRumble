[project]
name = "freerumble"
version = "0.1.0"
description = "Privacy-minded desktop Rumble client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "FreeRumble contributors" }]
dependencies = []
optional-dependencies = { resolver = ["yt-dlp>=2024.8.0"] }

[project.scripts]
freerumble = "freerumble.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["freerumble*"]

[tool.setuptools.package-data]
freerumble = ["static/*"]
